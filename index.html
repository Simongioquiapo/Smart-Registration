<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tindahan ni SAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="icon" type="image/png" href="../image/logo.png">
</head>
<body>

  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">
        <img src="../image/logo.png" alt="Portal Logo" width="50" height="50">
      </div>
      <span class="brand-name">Tindahan ni SAB</span>
    </div>

    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Enter your credentials to access your account</p>
    </div>

    <div id="toast" class="toast hidden"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="loginEmail" name="email" placeholder="name@company.com" required autocomplete="email">
        </div>
        <span class="field-error" id="loginEmailError"></span>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <input type="password" id="loginPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="toggleLoginPassword" aria-label="Toggle password visibility">
            <svg class="eye-icon eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="field-error" id="loginPasswordError"></span>
      </div>

      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
